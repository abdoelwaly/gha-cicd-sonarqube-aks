name: ci-cd

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_NAME: orders-api
  PYTHON_VERSION: "3.13"

jobs:
  # ------------------------------------------------------------ 1. code quality
  test:
    name: lint and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarQube needs full history for blame and new-code detection

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: app/pyproject.toml

      - name: install
        run: pip install -e ".[dev]"

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      - name: pytest
        run: pytest

      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: app/coverage.xml

  sonarqube:
    name: sonarqube scan and quality gate
    needs: test
    runs-on: ubuntu-latest
    if: vars.SONAR_HOST_URL != ''
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: app

      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

      # Fails the pipeline when the quality gate fails (coverage, bugs, smells, duplication).
      - uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}

  # ------------------------------------------------------------ 2. security
  security:
    name: dependency and IaC scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: trivy filesystem scan (deps, secrets, Helm misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ------------------------------------------------------------ 3. build
  build:
    name: build, scan and push image
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        run: echo "image=${{ vars.ACR_LOGIN_SERVER || 'local' }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: build
        uses: docker/build-push-action@v7
        with:
          context: app
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: azure login (OIDC)
        if: github.ref == 'refs/heads/main' && vars.ACR_LOGIN_SERVER != ''
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: push to ACR
        if: github.ref == 'refs/heads/main' && vars.ACR_LOGIN_SERVER != ''
        run: |
          az acr login --name "${ACR%%.*}"
          docker push "${{ steps.meta.outputs.image }}"
        env:
          ACR: ${{ vars.ACR_LOGIN_SERVER }}

  # ------------------------------------------------------------ 4. deploy
  deploy-dev:
    name: deploy to dev
    needs: build
    if: github.ref == 'refs/heads/main' && vars.ACR_LOGIN_SERVER != ''
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image: ${{ needs.build.outputs.image }}
    secrets: inherit

  deploy-prod:
    name: deploy to prod
    needs: [build, deploy-dev]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: prod # protected environment: requires a reviewer to approve
      image: ${{ needs.build.outputs.image }}
    secrets: inherit
